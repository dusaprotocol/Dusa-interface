[[redirects]]
  from = "/*"
  to = "/"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Content-Security-Policy = "frame-ancestors 'self';"

[[headers]]
  for = "/widget*"
  [headers.values]
    X-Frame-Options = ""
    Content-Security-Policy = "frame-ancestors *;"

